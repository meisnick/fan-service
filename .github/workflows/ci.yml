name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (control math, safety, validation, token)
        run: python tests/test_fanctl.py
      - name: Syntax
        run: |
          python -m py_compile fanctl/app/*.py fanctl/host/*.py scripts/*.py
          bash -n fanctl/host/fanctl_host.sh
          bash -n scripts/fanmap_run.sh
          python -c "import re;h=open('fanctl/app/static/index.html',encoding='utf-8').read();open('/tmp/page.js','w').write(chr(10).join(re.findall(r'<script>(.*?)</script>',h,re.S)))"
          node --check /tmp/page.js
      - name: Mock-mode smoke test
        run: |
          cd fanctl/app
          python fanctl.py --mock --data /tmp/mock --port 18090 &
          for i in $(seq 40); do
            if curl -sf localhost:18090/api/state -o /tmp/s.json && python -c "import json,sys;s=json.load(open('/tmp/s.json'));sys.exit(0 if len(s['drives'])==24 and s['zones']['0']['duty'] else 1)"; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1
          curl -sf localhost:18090/ | grep -q 'Temperature Information'
          curl -sf "localhost:18090/api/history?minutes=5" > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"slot":1,"on":true}' localhost:18090/api/locate)
          test "$code" = 403
